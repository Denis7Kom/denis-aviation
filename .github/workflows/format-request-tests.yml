name: Format request tests once
on:
  push:
    paths:
      - .github/workflows/format-request-tests.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Emit formatted public test sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import prettier from 'prettier';
          const paths = ['tests/firestore-security/rules.test.mjs','tests/pwa.cjs','tests/request-alerts.cjs','tests/request-chat-reliability.cjs','tests/request-message-alerts.cjs','tests/request-service.cjs'];
          const options = await prettier.resolveConfig('.prettierrc.json');
          for (const path of paths) {
            const content = await prettier.format(await readFile(path,'utf8'), {...options,filepath:path});
            console.log('FORMATTED_TEST_JSON:'+JSON.stringify({path,content}));
          }
          NODE
      - run: npm test
