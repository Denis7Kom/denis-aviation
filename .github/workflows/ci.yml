name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/firestore-security/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --prefix tests/firestore-security --ignore-scripts
      - name: Download pinned Firestore emulator
        run: >-
          curl --fail --silent --show-error --location
          https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar
          --output "$RUNNER_TEMP/firestore-emulator.jar"
      - name: Test Firestore rules with isolated identities
        run: npm run test:firestore-rules
        env:
          FIRESTORE_EMULATOR_JAR: ${{ runner.temp }}/firestore-emulator.jar
