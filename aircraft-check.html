<!doctype html><meta charset="utf-8"><title>Aircraft viewport check</title><style>body{margin:0;background:#111b27;color:#eef;font:14px system-ui}header{padding:10px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:1;background:#111b27}iframe{display:block;border:1px solid #345;margin:8px auto;background:#05080e}a{color:#acf}select,input{font:inherit}</style><header><a href="?width=390">390px</a><a href="?width=1100">1100px</a><label>Aircraft <select id="plane"><option>B777</option><option>A330-900</option><option>A330-300</option><option>A350-1000</option></select></label><label>View <select id="view"><option value="all">Overview</option><option value="cockpit">Cockpit</option><option value="gear">Gear</option></select></label><label>Gear <input id="gear" type="checkbox"></label><label>Angle <input id="angle" type="range" min="-180" max="180" value="26"></label><output id="mode"></output></header><iframe id="preview" title="Aircraft preview" height="810"></iframe><script>
localStorage.setItem('dk-aviation-motion','off');const frame=document.getElementById('preview');frame.width=new URLSearchParams(location.search).get('width')||1100;
frame.src='index.html#flying';
function apply(){const d=frame.contentDocument;d.querySelector('[data-aircraft="'+document.getElementById('plane').selectedIndex+'"]').click();d.querySelector('[data-detail="'+document.getElementById('view').value+'"]').click();const gear=d.getElementById('gear-toggle');if((gear.getAttribute('aria-pressed')==='true')!==document.getElementById('gear').checked)gear.click();const rot=d.getElementById('rotation');rot.value=document.getElementById('angle').value;rot.dispatchEvent(new Event('input'));d.querySelector('.model-wrap').scrollIntoView({block:'center',behavior:'instant'});document.getElementById('mode').textContent=d.getElementById('aircraft').dataset.renderer;}
frame.onload=apply;for(const id of ['plane','view','gear','angle'])document.getElementById(id).onchange=apply;
</script>
