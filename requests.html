<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080e"><title>Заявки на полёт — Denis Aviation</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="requests.css?v=3"></head>
<body><main class="wrap"><header><a class="brand" href="./#booking"><img src="favicon.svg" width="36" height="36" alt=""><span>DENIS KOMAROV<small>VIRTUAL AVIATION</small></span></a><div class="header-actions"><a class="back-link" href="./#booking" data-ru="← На сайт" data-en="← Back to site">← На сайт</a><button id="language" type="button" aria-label="Change language">EN</button></div></header><p class="eyebrow"><span class="signal"></span> FLIGHT REQUESTS <span class="eyebrow-divider">/</span> DENISKOM</p><h1 data-ru="Заявки на полёт" data-en="Flight requests">Заявки на полёт</h1><p data-ru="Войди через Google, чтобы отправить заявку и следить за её статусом." data-en="Sign in with Google to send a request and follow its status.">Войди через Google, чтобы отправить заявку и следить за её статусом.</p><div class="auth"><button id="login" type="button" data-ru="Войти через Google" data-en="Sign in with Google">Войти через Google</button><span id="identity"></span><button id="logout" type="button" hidden data-ru="Выйти" data-en="Sign out">Выйти</button></div><p id="notice" role="status" aria-live="polite"></p>
<section id="area" hidden><div class="grid"><section class="card form-card"><div class="card-top"><span>01 / REQUEST</span><span class="corner-mark">+</span></div><h2 data-ru="Новая заявка" data-en="New request">Новая заявка</h2><form id="form"><label><span data-ru="Тип" data-en="Type">Тип</span><select name="type"><option value="flight" data-ru="Совместный полёт" data-en="Fly together">Совместный полёт</option><option value="atc" data-ru="Диспетчерский контроль" data-en="ATC control">Диспетчерский контроль</option></select></label><label><span data-ru="Сеть" data-en="Network">Сеть</span><select name="network"><option>Infinite Flight</option><option>VATSIM</option><option>IVAO</option><option value="Other" data-ru="Другая" data-en="Other">Другая</option></select></label><label><span data-ru="Дата" data-en="Date">Дата</span><input type="date" name="date" required></label><label><span data-ru="Время" data-en="Time">Время</span><input type="time" name="time" required></label><label><span data-ru="Часовой пояс" data-en="Time zone">Часовой пояс</span><input name="timezone" maxlength="80" required></label><label><span data-ru="Ник / позывной" data-en="Username / callsign">Ник / позывной</span><input name="callsign" maxlength="80" required></label><label><span data-ru="Маршрут или аэропорт" data-en="Route or airport">Маршрут или аэропорт</span><input name="route" maxlength="120" required></label><label><span data-ru="Контакт для ответа" data-en="Contact for reply">Контакт для ответа</span><input name="contact" maxlength="120" required></label><label><span data-ru="Детали (необязательно)" data-en="Details (optional)">Детали (необязательно)</span><textarea name="notes" maxlength="1000" rows="3"></textarea></label><button id="send" type="submit" data-ru="Отправить заявку" data-en="Send request">Отправить заявку</button></form></section><section class="card list-card"><div class="card-top"><span>02 / FLIGHT BOARD</span><span class="live-indicator">● LIVE</span></div><h2 id="list-title"></h2><p data-ru="Статус обновляется на этой странице. Время считается согласованным после подтверждения." data-en="Status updates on this page. The time is agreed only after confirmation.">Статус обновляется на этой странице. Время считается согласованным после подтверждения.</p><div id="list" aria-live="polite"></div></section></div></section></main><script type="module" src="requests.js?v=2"></script></body></html>
